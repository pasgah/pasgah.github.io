<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وبلاگ ایندکس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: #fbf8f3;
    color: #2c2419;
    line-height: 2;
    font-size: 16px;
    padding: 60px 24px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    color: #2c2419;
    margin-bottom: 8px;
  }

  .sub {
    color: #8a7a63;
    font-size: 0.9rem;
    margin-bottom: 40px;
  }

  ul {
    list-style: none;
  }

  li {
    border-bottom: 1px solid #e8e0d3;
  }

  li:last-child {
    border-bottom: none;
  }

  a {
    display: block;
    padding: 18px 0;
    color: #2c2419;
    text-decoration: none;
    transition: color 0.2s ease, padding 0.2s ease;
  }

  a:hover {
    color: #a0522d;
    padding-right: 6px;
  }

  a .title {
    font-size: 1.05rem;
    font-weight: 500;
    display: block;
    margin-bottom: 4px;
  }

  a .date {
    font-size: 0.82rem;
    color: #8a7a63;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>آرشیو نوشته‌ها</h1>
    <p class="sub">فهرست یادداشت‌ها به ترتیب تاریخ</p>

    <ul>
      <li>
        <a href="قادسیه">
          <span class="title">قادسیه</span>
          <span class="date">۲۸ آذر ۱۴۰۳</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
