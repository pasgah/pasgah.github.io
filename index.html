<h1>به دانشنامهٔ ایندکس خوش آمدید</h1>
<p>ایندکس یک دانشنامهٔ آزاد است. هدف ما گردآوری دانش بشری به زبان فارسی است.</p>

<h2>آخرین مقالات</h2>
<ul id="postList"></ul>
<noscript>
    <ul>
        {% for post in site.posts %}
            <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
        {% else %}
            <li>هیچ مقاله‌ای منتشر نشده است.</li>
        {% endfor %}
    </ul>
</noscript>

<script>
    (() => {
        const postsDataElement = document.getElementById('posts-data');
        const postList = document.getElementById('postList');
        
        if (!postList) return;
        
        if (!postsDataElement) {
            postList.innerHTML = '<li>داده‌ای یافت نشد</li>';
            return;
        }
        
        let postsData = [];
        try {
            postsData = JSON.parse(postsDataElement.textContent);
        } catch (e) {
            postList.innerHTML = '<li>خطا در بارگذاری مقالات</li>';
            return;
        }
        
        if (postsData.length === 0) {
            postList.innerHTML = '<li>هیچ مقاله‌ای منتشر نشده است.</li>';
            return;
        }
        
        const fragment = document.createDocumentFragment();
        postsData.forEach(post => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = post.url;
            a.textContent = post.title;
            li.appendChild(a);
            fragment.appendChild(li);
        });
        postList.appendChild(fragment);
    })();
</script>
