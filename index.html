<h1>به دانشنامهٔ ایندکس خوش آمدید</h1>
<p>ایندکس یک دانشنامهٔ آزاد است. هدف ما گردآوری دانش بشری به زبان فارسی است.</p>

<h2>آخرین مقالات</h2>
<ul id="postList"></ul>

<script>
    (() => {
        const postsDataElement = document.getElementById('posts-data');
        const postList = document.getElementById('postList');
        if (!postsDataElement || !postList) return;
        const postsData = JSON.parse(postsDataElement.textContent);
        const fragment = document.createDocumentFragment();
        postsData.forEach(post => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = post.url;
            a.textContent = post.title;
            li.appendChild(a);
            fragment.appendChild(li);
        });
        postList.appendChild(fragment);
    })();
</script>
