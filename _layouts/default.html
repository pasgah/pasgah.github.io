<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایندکس · {{ page.title | default: 'دانشنامهٔ آزاد' }}</title>
    <link rel="preload" href="{{ '/index.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{{ '/index.css' | relative_url }}"></noscript>
    <link rel="icon" href="{{ '/index.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<div class="mw-wrapper">
    <header class="mw-header">
        <div class="mw-logo">
            <small>دانشنامهٔ</small> ایندکس
        </div>
        <div class="live-search-wrapper" role="search">
            <input type="search" id="searchInput" class="live-search-input" placeholder="جستجو در مقالات" autocomplete="off" aria-label="جستجو در مقالات" aria-autocomplete="list" aria-controls="liveSearchResults" aria-expanded="false">
            <ul class="live-search-results" id="liveSearchResults" role="listbox" aria-label="نتایج جستجو" style="display: none;"></ul>
        </div>
    </header>
    <main class="mw-content">
        {% if page.url != '/' %}
        <div class="back-link">
            <a href="{{ '/' | relative_url }}">→ بازگشت به صفحه اصلی</a>
        </div>
        {% endif %}
        {% if page.title and page.url != '/' %}
        <h1 class="article-title">{{ page.title }}</h1>
        {% endif %}
        {{ content }}
    </main>
    <footer class="mw-footer">
        <div>
            این محتوا تحت مجوز WTFPL منتشر شده است.
        </div>
        <div>
            <a href="https://indexes.ir">ایندکس</a> · دانشنامهٔ آزاد
        </div>
    </footer>
</div>
<script>
    (() => {
        const searchInput = document.getElementById('searchInput');
        const resultsBox = document.getElementById('liveSearchResults');
        if (!searchInput || !resultsBox) return;
        let postsData = [];
        let debounceTimer;
        const escapeHtml = (str) => {
            return str.replace(/[&<>'"]/g, (tag) => {
                const chars = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                return chars[tag] || tag;
            });
        };
        const normalize = (text) => {
            if (!text) return '';
            return text
                .toLowerCase()
                .replace(/[\u200c\s]+/g, ' ')
                .replace(/[يى]/g, 'ی')
                .replace(/[ك]/g, 'ک')
                .trim();
        };
        const renderResults = (term) => {
            const normalizedTerm = normalize(term);
            if (!normalizedTerm || postsData.length === 0) {
                resultsBox.style.display = 'none';
                searchInput.setAttribute('aria-expanded', 'false');
                return;
            }
            const filtered = postsData.filter((item) => normalize(item.title).includes(normalizedTerm));
            let html = '';
            if (filtered.length === 0) {
                html = '<li class="no-result" role="option" aria-selected="false">هیچ مقاله‌ای یافت نشد</li>';
            } else {
                filtered.forEach((item) => {
                    html += `<li role="option"><a href="${escapeHtml(item.url)}">${escapeHtml(item.title)}</a></li>`;
                });
            }
            resultsBox.innerHTML = html;
            resultsBox.style.display = 'block';
            searchInput.setAttribute('aria-expanded', 'true');
        };
        fetch('/index.json')
            .then((response) => {
                if (!response.ok) throw new Error('Network error');
                return response.json();
            })
            .then((data) => {
                postsData = data;
            })
            .catch((err) => {
                console.warn(err);
            });
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                renderResults(searchInput.value);
            }, 200);
        });
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim() !== '' && postsData.length > 0) {
                renderResults(searchInput.value);
            }
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.live-search-wrapper')) {
                resultsBox.style.display = 'none';
                searchInput.setAttribute('aria-expanded', 'false');
            }
        });
    })();
</script>
</body>
</html>
