<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایندکس · {{ page.title | default: 'دانشنامهٔ آزاد' }}</title>
    <link rel="stylesheet" href="{{ '/index.css' | relative_url }}">
    <link rel="icon" href="{{ '/index.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<div class="mw-wrapper">
    <header class="mw-header">
        <div class="mw-logo">
            <small>دانشنامهٔ</small> ایندکس
        </div>
        <div class="mw-search">
            <input type="search" id="searchInput" placeholder="جستجو در ایندکس" aria-label="جستجو">
        </div>
    </header>
    <aside class="mw-sidebar"></aside>
    <main class="mw-content">
        {{ content }}
    </main>
    <footer class="mw-footer">
        <div>
            این محتوا تحت مجوز <a href="#">CC BY-SA 4.0</a> منتشر شده است.
        </div>
        <div>
            <a href="https://indexes.ir">indexes.ir</a> · دانشنامهٔ آزاد
        </div>
    </footer>
</div>
<script>
    (function() {
        const searchInput = document.getElementById('searchInput');
        if (!searchInput) return;
        const postList = document.getElementById('postList');
        if (!postList) return;

        let postsData = [];

        function renderPosts(filter = '') {
            const query = filter.trim().toLowerCase();
            const filtered = query === ''
                ? postsData
                : postsData.filter(p => p.title.toLowerCase().includes(query));

            if (filtered.length === 0) {
                postList.innerHTML = '<li>هیچ پستی یافت نشد</li>';
                return;
            }

            let html = '';
            for (const post of filtered) {
                html += `<li><a href="${post.url}">${post.title}</a></li>`;
            }
            postList.innerHTML = html;
        }

        fetch('/index.json')
            .then(res => res.ok ? res.json() : Promise.reject())
            .then(data => {
                postsData = data;
                renderPosts();
            })
            .catch(() => {
                postList.innerHTML = '<li>خطا در بارگذاری لیست پست‌ها</li>';
            });

        searchInput.addEventListener('input', function(e) {
            renderPosts(e.target.value);
        });
    })();
</script>
</body>
</html>
