<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایندکس · {{ page.title | default: 'دانشنامهٔ آزاد' }}</title>
    <link rel="stylesheet" href="{{ '/index.css' | relative_url }}">
    <link rel="icon" href="{{ '/index.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<div class="mw-wrapper">
    <header class="mw-header">
        <div class="mw-logo">
            <small>دانشنامهٔ</small> ایندکس
        </div>
        <div class="mw-search">
            <input type="search" id="searchInput" placeholder="جستجو در مقالات" aria-label="جستجو">
        </div>
    </header>
    <main class="mw-content">
        {{ content }}
    </main>
    <footer class="mw-footer">
        <div>
            این محتوا تحت مجوز <a href="#">CC BY-SA 4.0</a> منتشر شده است.
        </div>
        <div>
            <a href="https://indexes.ir">indexes.ir</a> · دانشنامهٔ آزاد
        </div>
    </footer>
</div>
<script>
    (function() {
        // المنت‌ها
        var searchInput = document.getElementById('searchInput');
        var postList = document.getElementById('postList');
        if (!searchInput || !postList) return;

        var postsData = [];

        function renderPosts(filter) {
            filter = filter || '';
            var query = filter.trim().toLowerCase();
            var filtered = query === '' ? postsData : postsData.filter(function(p) {
                return p.title.toLowerCase().includes(query);
            });

            if (filtered.length === 0) {
                postList.innerHTML = '<li>هیچ مقاله‌ای یافت نشد</li>';
                return;
            }

            var html = '';
            for (var i = 0; i < filtered.length; i++) {
                html += '<li><a href="' + filtered[i].url + '">' + filtered[i].title + '</a></li>';
            }
            postList.innerHTML = html;
        }

        // بارگذاری داده‌ها از index.json
        fetch('/index.json')
            .then(function(res) {
                if (!res.ok) throw new Error('Network error');
                return res.json();
            })
            .then(function(data) {
                postsData = data;
                renderPosts('');
            })
            .catch(function() {
                postList.innerHTML = '<li>خطا در بارگذاری لیست مقالات</li>';
            });

        // رویداد جستجو
        searchInput.addEventListener('input', function(e) {
            renderPosts(e.target.value);
        });
    })();
</script>
</body>
</html>
