<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایندکس · {{ page.title | default: 'دانشنامهٔ آزاد' }}</title>
    <link rel="stylesheet" href="{{ '/index.css' | relative_url }}">
    <link rel="icon" href="{{ '/index.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<div class="mw-wrapper">
    <header class="mw-header">
        <div class="mw-logo">
            <small>دانشنامهٔ</small> ایندکس
        </div>
        <div class="mw-search">
            <input type="search" id="searchInput" placeholder="جستجو در مقالات" aria-label="جستجو" autocomplete="off">
        </div>
    </header>
    <main class="mw-content">
        {{ content }}
    </main>
    <footer class="mw-footer">
        <div>
            این محتوا تحت مجوز <a href="#">CC BY-SA 4.0</a> منتشر شده است.
        </div>
        <div>
            <a href="https://indexes.ir">indexes.ir</a> · دانشنامهٔ آزاد
        </div>
    </footer>
</div>
<script>
    (function() {
        'use strict';

        var searchInput = document.getElementById('searchInput');
        var postList = document.getElementById('postList');
        if (!searchInput || !postList) return;

        var postsData = [];
        var debounceTimer;

        function normalize(text) {
            if (!text) return '';
            return text
                .toLowerCase()
                .replace(/[\u200c\s]+/g, ' ')
                .replace(/[يى]/g, 'ی')
                .replace(/[ك]/g, 'ک')
                .trim();
        }

        function renderPosts(term) {
            var normalizedTerm = normalize(term);
            var html = '';

            if (!normalizedTerm || postsData.length === 0) {
                if (postsData.length === 0) {
                    postList.innerHTML = '<li>در حال بارگذاری...</li>';
                } else {
                    postsData.forEach(function(post) {
                        html += '<li><a href="' + post.url + '">' + post.title + '</a></li>';
                    });
                    postList.innerHTML = html;
                }
                return;
            }

            var filtered = postsData.filter(function(item) {
                return normalize(item.title).includes(normalizedTerm);
            });

            if (filtered.length === 0) {
                html = '<li>هیچ مقاله‌ای یافت نشد</li>';
            } else {
                filtered.forEach(function(item) {
                    html += '<li><a href="' + item.url + '">' + item.title + '</a></li>';
                });
            }
            postList.innerHTML = html;
        }

        fetch('/index.json')
            .then(function(response) {
                if (!response.ok) throw new Error('مشکل در بارگذاری داده‌ها');
                return response.json();
            })
            .then(function(data) {
                postsData = data;
                renderPosts('');
            })
            .catch(function(err) {
                console.warn('خطا در بارگذاری index.json:', err);
                postList.innerHTML = '<li>خطا در بارگذاری لیست مقالات</li>';
            });

        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function() {
                renderPosts(searchInput.value);
            }, 200);
        });

        searchInput.addEventListener('focus', function() {
            if (searchInput.value.trim() !== '' && postsData.length > 0) {
                renderPosts(searchInput.value);
            }
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.mw-search')) {
                // اگر نیاز به مخفی کردن نتایج دارید، می‌توانید اینجا کد بگذارید
            }
        });
    })();
</script>
</body>
</html>
