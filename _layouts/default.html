<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url | replace:'index.html','' }}">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "{{ site.title }}",
        "url": "{{ site.url }}",
        "potentialAction": {
            "@type": "SearchAction",
            "target": "{{ site.url }}/?s={search_term_string}",
            "query-input": "required name=search_term_string"
        }
    }
    </script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="logo">
                <img src="https://www.pasgah.org/blog.svg" alt="{{ site.title }}" width="120" height="40">
            </a>
            <div class="search-box">
                <input type="search" id="searchInput" placeholder="جستجوی پست‌ها..." autocomplete="off" aria-label="جستجو">
            </div>
        </div>
    </header>
    <main class="site-main">
        <div class="container">
            {{ content }}
        </div>
    </main>
    <div class="post-overlay" id="postOverlay" style="display:none;">
        <div class="overlay-content">
            <button class="close-overlay" id="closeOverlay" aria-label="بستن">&times;</button>
            <article class="post-full" id="postFullContent"></article>
        </div>
    </div>
    <script src="{{ '/script.js' | relative_url }}" defer></script>
</body>
</html>
