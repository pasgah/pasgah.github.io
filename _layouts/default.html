<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایندکس · {{ page.title | default: 'دانشنامهٔ آزاد' }}</title>
    <link rel="stylesheet" href="{{ '/index.css' | relative_url }}">
    <link rel="icon" href="{{ '/index.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<div class="mw-wrapper">
    <header class="mw-header">
        <div class="mw-logo">
            <small>دانشنامهٔ</small> ایندکس
        </div>
        <div class="live-search-wrapper">
            <input type="text" id="searchInput" class="live-search-input" placeholder="جستجو در مقالات" autocomplete="off">
            <button type="button" class="clear-search" id="clearSearch" aria-label="پاک کردن متن جستجو">×</button>
            <ul class="live-search-results" id="liveSearchResults"></ul>
        </div>
    </header>
    <main class="mw-content">
        {% if page.url != '/' %}
        <div class="back-link">
            <a href="{{ '/' | relative_url }}">→ بازگشت به صفحه اصلی</a>
        </div>
        {% endif %}
        {% if page.title and page.url != '/' %}
        <h1 class="article-title">{{ page.title }}</h1>
        {% endif %}
        {{ content }}
    </main>
    <footer class="mw-footer">
        <div>
            این محتوا تحت مجوز <a href="#">CC BY-SA 4.0</a> منتشر شده است.
        </div>
        <div>
            <a href="https://indexes.ir">indexes.ir</a> · دانشنامهٔ آزاد
        </div>
    </footer>
</div>
<script>
    (function() {
        'use strict';
        var searchInput = document.getElementById('searchInput');
        var resultsBox = document.getElementById('liveSearchResults');
        var clearBtn = document.getElementById('clearSearch');
        if (!searchInput || !resultsBox || !clearBtn) return;
        var postsData = [];
        var debounceTimer;
        function normalize(text) {
            if (!text) return '';
            return text
                .toLowerCase()
                .replace(/[\u200c\s]+/g, ' ')
                .replace(/[يى]/g, 'ی')
                .replace(/[ك]/g, 'ک')
                .trim();
        }
        function renderResults(term) {
            var normalizedTerm = normalize(term);
            var html = '';
            if (!normalizedTerm || postsData.length === 0) {
                resultsBox.style.display = 'none';
                return;
            }
            var filtered = postsData.filter(function(item) {
                return normalize(item.title).includes(normalizedTerm);
            });
            if (filtered.length === 0) {
                html = '<li class="no-result">هیچ مقاله‌ای یافت نشد</li>';
            } else {
                filtered.forEach(function(item) {
                    html += '<li><a href="' + item.url + '">' + item.title + '</a></li>';
                });
            }
            resultsBox.innerHTML = html;
            resultsBox.style.display = 'block';
        }
        function clearSearch() {
            searchInput.value = '';
            resultsBox.style.display = 'none';
            clearBtn.style.display = 'none';
            searchInput.focus();
        }
        fetch('/index.json')
            .then(function(response) {
                if (!response.ok) throw new Error('مشکل در بارگذاری داده‌ها');
                return response.json();
            })
            .then(function(data) {
                postsData = data;
            })
            .catch(function(err) {
                console.warn('خطا در بارگذاری index.json:', err);
            });
        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function() {
                renderResults(searchInput.value);
            }, 200);
            if (searchInput.value.trim() !== '') {
                clearBtn.style.display = 'block';
            } else {
                clearBtn.style.display = 'none';
            }
        });
        searchInput.addEventListener('focus', function() {
            if (searchInput.value.trim() !== '' && postsData.length > 0) {
                renderResults(searchInput.value);
            }
        });
        clearBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            clearSearch();
        });
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.live-search-wrapper')) {
                resultsBox.style.display = 'none';
            }
        });
    })();
</script>
</body>
</html>
