---
layout: default
---
<article class="post-article">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}" class="date">{{ page.dateFormatted }}</time>
    </header>
    <div class="post-body">
        {{ content }}
    </div>
    <a href="/" class="back-home">← بازگشت به صفحه اصلی</a>
</article>
