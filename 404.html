<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: #fbf8f3;
    color: #2c2419;
    line-height: 2;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .wrap {
    max-width: 480px;
    text-align: center;
  }

  .code {
    font-size: 6rem;
    font-weight: 600;
    color: #e8e0d3;
    line-height: 1;
    letter-spacing: -4px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #2c2419;
    margin-bottom: 12px;
  }

  p {
    color: #8a7a63;
    font-size: 0.95rem;
    margin-bottom: 32px;
  }

  a {
    display: inline-block;
    padding: 10px 24px;
    color: #a0522d;
    text-decoration: none;
    border: 1px solid #d8ceba;
    border-radius: 6px;
    font-size: 0.95rem;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  a:hover {
    background: #a0522d;
    color: #fbf8f3;
    border-color: #a0522d;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">۴۰۴</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>نشانی‌ای که وارد کرده‌اید وجود ندارد یا جابه‌جا شده است.</p>
    <a href="/">بازگشت به صفحه اصلی</a>
  </div>
</body>
</html>
