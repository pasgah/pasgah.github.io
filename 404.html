<h1>خطای ۴۰۴</h1>
<p>متأسفیم، صفحه‌ای که به دنبال آن هستید وجود ندارد یا به آدرس دیگری منتقل شده است.</p>
<p>می‌توانید از جستجوی بالا استفاده کنید یا به <a href="{{ '/' | relative_url }}">صفحه اصلی</a> بازگردید.</p>

<h2>آخرین مقالات</h2>
<ul id="postList"></ul>

<script>
    (() => {
        const postsDataElement = document.getElementById('posts-data');
        const postList = document.getElementById('postList');
        if (!postsDataElement || !postList) return;
        const postsData = JSON.parse(postsDataElement.textContent);
        const fragment = document.createDocumentFragment();
        postsData.forEach(post => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = post.url;
            a.textContent = post.title;
            li.appendChild(a);
            fragment.appendChild(li);
        });
        postList.appendChild(fragment);
    })();
</script>
